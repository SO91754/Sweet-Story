<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aanvragen — Sweet Story</title><link rel="stylesheet" href="/css/style.css">
<style>.orders{padding:34px 0 60px}.order-list{display:grid;gap:14px}.order-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px}.order-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;flex-wrap:wrap}.order-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}.order-meta div{background:var(--lav2);padding:10px;border-radius:12px}.order-meta small{display:block;color:var(--muted);margin-bottom:3px}.order-body{display:grid;grid-template-columns:1fr 1fr;gap:15px}.order-body p{white-space:pre-wrap;color:var(--muted);line-height:1.5}.badge{padding:7px 11px;border-radius:999px;font-size:12px;font-weight:800;background:#fff2cf}.badge.confirmed{background:#e4f4e8}.badge.rejected{background:#fde6e6}.badge.done{background:#e8ecf8}@media(max-width:760px){.order-meta,.order-body{grid-template-columns:1fr}}</style></head>
<body>
<header class="site-header"><div class="wrap nav"><a class="brand" href="/">Sweet <span>Story</span></a><nav class="main-nav"><a href="/">Website</a><a href="/admin.html">Creaties</a><a href="/orders.html">Aanvragen</a></nav><button class="btn secondary" id="logout">Uitloggen</button></div></header>
<main class="wrap orders"><div class="kicker">Beheer</div><h1 style="font-size:46px">Bestelaanvragen</h1><p style="color:var(--muted)">Nieuwe aanvragen die via de website binnenkomen.</p><div class="status" id="ordersStatus">Aanvragen laden...</div><div class="order-list" id="ordersList" style="margin-top:16px"></div></main>
<script src="/js/orders.js"></script></body></html>
